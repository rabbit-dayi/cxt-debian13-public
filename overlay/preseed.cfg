#_preseed_V1
# Debian 13 trixie amd64; no target disk or GitHub identity is preselected.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string
# Leave DHCP failure/manual address questions interactive; do not fake success.
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/protocol string https
d-i mirror/https/hostname string deb.debian.org
d-i mirror/https/directory string /debian
d-i mirror/https/proxy string
d-i mirror/suite string trixie
d-i mirror/udeb/suite string trixie
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/enable-source-repositories boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# A lock marker, not a password or password hash. Root login is SSH-key-only.
d-i passwd/root-password-crypted password *

# This command must NEVER return until GitHub and exact-disk authorization pass.
# It runs after network configuration/component download, immediately before
# partman selects or modifies a target. A missing/broken hook fails closed.
d-i partman/early_command string while ! /cxt/preflight; do logger -t cxt-preflight 'Preflight failed; partitioning blocked'; sleep 3; done
# Atomic uses the standard BIOS/UEFI-aware recipe: ext4 root plus swap.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/default_filesystem string ext4
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect ssh-server, standard
d-i pkgsel/include string openssh-server ca-certificates
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# Ask d-i itself to install BOOTX64.EFI as well as the normal Debian/NVRAM path.
# grub-installer forwards this to the target grub2/force_efi_extra_removable key.
d-i grub-installer/force-efi-extra-removable boolean true
d-i grub-installer/update-nvram boolean true
# grub-installer/bootdev and partman-auto/disk are set only by approved preflight.
d-i preseed/late_command string while ! /cxt/late-install; do logger -t cxt-install 'Final installation checks failed; completion blocked'; sleep 3; done
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
