# Same-version GRUB modules are installed for BIOS, x64 EFI and IA32 EFI.
# Text terminals only: never require all_video, gfxterm, PNG, a theme, or a font.
set default=debian13
set timeout=15
set timeout_style=menu
set pager=1
if serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1; then
    terminal_input console serial
    terminal_output console serial
else
    terminal_input console
    terminal_output console
fi

menuentry 'Debian 13 Public - SSH + standard utilities (screen console)' --id debian13 --hotkey=d {
    search --no-floppy --file --set=root /CXT-DEBIAN13-BOOT
    linux /Sources/Debian/vmlinuz auto=true priority=critical preseed/file=/preseed.cfg netcfg/choose_interface=auto debian-installer/framebuffer=false vga=normal console=tty0
    initrd /Sources/Debian/initrd.gz
}

menuentry 'Debian 13 Public - serial console COM1 115200 (headless / no graphics)' --id debian13serial --hotkey=s {
    search --no-floppy --file --set=root /CXT-DEBIAN13-BOOT
    linux /Sources/Debian/vmlinuz auto=true priority=critical preseed/file=/preseed.cfg netcfg/choose_interface=auto debian-installer/framebuffer=false DEBIAN_FRONTEND=text console=ttyS0,115200n8
    initrd /Sources/Debian/initrd.gz
}

menuentry 'Reboot' --hotkey=r { reboot; }
menuentry 'Power off' --hotkey=h { halt; }
